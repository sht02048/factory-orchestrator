name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "The v* tag to release"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      notes-start-tag: ${{ steps.plan.outputs.notes-start-tag }}
    steps:
      - name: Choose the tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "tag=${TAG:?}" >> "$GITHUB_OUTPUT"
      - name: Stop if the Release already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "${TAG:?}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::The Release $TAG already exists. Delete it first to release $TAG again."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Check tag, versions, and main
        id: plan
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: node scripts/release-plan.ts

  check:
    needs: plan
    uses: ./.github/workflows/ci.yml

  macos:
    needs: plan
    runs-on: macos-26
    environment: release
    timeout-minutes: 90
    steps:
      - name: Set temporary paths
        run: |
          {
            echo "KEYCHAIN=$RUNNER_TEMP/release.keychain-db"
            echo "API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Import signing certificate into a temporary keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          cert="$RUNNER_TEMP/developer-id.p12"
          intermediate="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$cert"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$intermediate"
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          security import "$intermediate" -k "$KEYCHAIN"
          security import "$cert" -k "$KEYCHAIN" -f pkcs12 -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "${cert:?}" "${intermediate:?}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$KEYCHAIN" > /dev/null
          existing="$(security list-keychains -d user | tr -d '"' | xargs)"
          read -r -a keychains <<< "$existing"
          security list-keychains -d user -s "$KEYCHAIN" "${keychains[@]}"
      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          umask 077
          printf '%s' "$APPLE_API_KEY" | base64 --decode > "$API_KEY_PATH"
      - name: Build, sign, and notarize the dmg
        id: release
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: APPLE_API_KEY_PATH="$API_KEY_PATH" MACOS_SIGN_KEYCHAIN="$KEYCHAIN" pnpm release:mac
      - name: Verify the dmg and the app inside it
        env:
          DMG: ${{ steps.release.outputs.dmg }}
        run: |
          dmg="$DMG"
          mount="$RUNNER_TEMP/ganger-dmg"
          mkdir -p "$mount"
          codesign --verify --strict --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          codesign --verify --deep --strict --verbose=2 "$mount/Ganger.app"
          xcrun stapler validate "$mount/Ganger.app"
          spctl --assess --type execute --verbose=2 "$mount/Ganger.app"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-dmg
          path: ${{ steps.release.outputs.dmg }}
          if-no-files-found: error
          retention-days: 7
      - name: Remove the temporary keychain and API key
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -f "${API_KEY_PATH:?}"

  publish:
    needs: [plan, check, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: macos-dmg
          path: release
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          NOTES_START_TAG: ${{ needs.plan.outputs.notes-start-tag }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          elif [ -n "$NOTES_START_TAG" ]; then
            args+=(--notes-start-tag "$NOTES_START_TAG")
          fi
          gh release create "$TAG" "${args[@]}" release/*.dmg
