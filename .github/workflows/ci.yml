name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_call:

# pull request는 새 커밋이 오면 앞 실행을 취소한다. main push는 커밋마다 따로 묶어 연속 병합 때도
# 앞 커밋의 CI가 취소되거나 대기 중에 밀려나지 않게 한다.
concurrency:
  group: ci-${{ (github.event_name == 'pull_request' || github.ref_type == 'tag') && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Detect docs-only change
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          base="$PUSH_BEFORE"
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; fi
          files=""
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            files=$(git diff --name-only --no-renames "$base" "$HEAD_SHA")
          fi
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '\.md$'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Only Markdown changed; skipping checks."
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  static:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Color literals
        run: pnpm run check:colors
      - name: Style lengths
        run: pnpm run check:lengths
      - name: Format check
        run: pnpm run format:check
      # 브라우저 시험(e2e·demo)은 browser 잡이 shard 로 나눠 돈다.
      - name: Unit tests
        run: pnpm exec vitest run --project '!e2e' --project '!demo'
      - name: Build
        run: pnpm run build
      - name: Web production smoke test
        run: pnpm run smoke:web
      - name: CLI smoke test
        run: pnpm run smoke:cli
      - name: Server bundle
        run: pnpm run bundle
      # 배포물을 저장소 밖 임시 폴더에 풀어 init·start·러너 확인을 돌린다(티켓 0029).
      - name: Server bundle smoke test
        run: pnpm run smoke:bundle

  browser:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    name: browser (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Browser tests
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: pnpm exec vitest run --project e2e --project demo --shard="$SHARD" --maxWorkers=2
      # 브라우저 시험(e2e)이 실패하면 그때의 화면을 남긴다.
      - name: Upload browser test screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-test-screenshots-${{ matrix.shard }}
          path: e2e/test-results/
          if-no-files-found: ignore

  # develop·main ruleset 이 필수 상태 검사로 이 잡 이름(check)을 본다.
  check:
    needs: [scope, static, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          SCOPE: ${{ needs.scope.result }}
          CODE: ${{ needs.scope.outputs.code }}
          STATIC: ${{ needs.static.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          echo "scope=$SCOPE code=$CODE static=$STATIC browser=$BROWSER"
          if [ "$SCOPE" != "success" ]; then
            echo "::error::scope job did not succeed ($SCOPE)."
            exit 1
          fi
          if [ "$CODE" = "false" ]; then
            echo "Only Markdown changed; checks skipped."
            exit 0
          fi
          if [ "$CODE" != "true" ]; then
            echo "::error::scope job gave no result."
            exit 1
          fi
          if [ "$STATIC" != "success" ] || [ "$BROWSER" != "success" ]; then
            echo "::error::static=$STATIC browser=$BROWSER; every job must succeed."
            exit 1
          fi
