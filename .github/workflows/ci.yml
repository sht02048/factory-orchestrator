name: CI

on:
  pull_request:
  push:
    branches: [main]

# pull request는 새 커밋이 오면 앞 실행을 취소한다. main push는 커밋마다 따로 묶어 연속 병합 때도
# 앞 커밋의 CI가 취소되거나 대기 중에 밀려나지 않게 한다.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Color literals
        run: pnpm run check:colors
      - name: Format check
        run: pnpm run format:check
      - name: Test
        run: pnpm run test
      # 브라우저 시험(e2e)이 실패하면 그때의 화면을 남긴다.
      - name: Upload browser test screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-screenshots
          path: e2e/test-results/
          if-no-files-found: ignore
      - name: Build
        run: pnpm run build
      # 개발 진입점(pnpm dev)의 가짜 어댑터·가짜 값이 배포물에 들어가지 않았는지 본다.
      - name: Dev-only code check
        run: pnpm run check:dev-code
      - name: Web production smoke test
        run: pnpm run smoke:web
      - name: CLI smoke test
        run: pnpm run smoke:cli
      - name: Server bundle
        run: pnpm run bundle
      # 배포물을 저장소 밖 임시 폴더에 풀어 init·start·러너 확인을 돌린다(티켓 0029).
      - name: Server bundle smoke test
        run: pnpm run smoke:bundle
