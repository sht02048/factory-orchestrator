name: CI

on:
  pull_request:
  push:
    branches: [main]

# pull request는 새 커밋이 오면 앞 실행을 취소한다. main push는 커밋마다 따로 묶어 연속 병합 때도
# 앞 커밋의 CI가 취소되거나 대기 중에 밀려나지 않게 한다.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Color literals
        run: pnpm run check:colors
      - name: Format check
        run: pnpm run format:check
      - name: Test
        run: pnpm run test
      - name: Build
        run: pnpm run build
      - name: Web production smoke test
        run: pnpm run smoke:web
