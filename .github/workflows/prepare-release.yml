name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version without the v, such as 0.1.0 or 0.1.0-rc.2"
        required: true
        type: string

concurrency:
  group: prepare-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pull-request:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-bot
    steps:
      - name: Check the release app settings
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY are not set in the release-bot environment. Follow \"Automatic releases\" in README.md to set up the release app."
            exit 1
          fi
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Bump the versions on a release branch
        id: bump
        env:
          VERSION: ${{ inputs.version }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          branch="release/v${VERSION:?}"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "::error::Branch $branch already exists. Merge or close its pull request and delete the branch first."
            exit 1
          fi
          node scripts/release-version.ts bump "$VERSION"
          user_id="$(gh api "users/${APP_SLUG:?}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id:?}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add package.json apps/desktop/package.json
          git commit -m "🔖 release: 버전을 ${VERSION} 로 올리기"
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Open the pull request
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          body="$(printf '%s\n\n%s\n' \
            "Bump the version in package.json and apps/desktop/package.json to ${VERSION:?}." \
            "Merging this pull request makes the Tag release workflow create v${VERSION}, which starts the Release workflow.")"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "${BRANCH:?}" \
            --title "🔖 release: 버전을 ${VERSION} 로 올리기" --body "$body"
