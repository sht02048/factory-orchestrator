packages:
  - apps/*
  - packages/*
  - e2e

# lefthook 훅 설치는 루트 prepare 스크립트(lefthook install)가 맡는다.
allowBuilds:
  lefthook: false

# package.json engines 를 어기면 경고에서 그치지 않고 설치를 실패시킨다. pnpm 12 는 이 설정을 .npmrc 가
# 아니라 여기서 읽는다(.npmrc 의 engine-strict 는 무시하고 경고만 낸다).
engineStrict: true

# UI SDK는 베타라 새 버전이 자주 나온다. 공개 하루 안의 버전도 쓰려고 정확한 버전만 최소 공개 기간
# 검사에서 뺀다(docs/research/0001). 버전을 올리면 이 목록도 같은 버전으로 바꾼다.
minimumReleaseAgeExclude:
  - "@ui-sdk/core@0.1.0-beta.6"
  - "@ui-sdk/react@0.1.0-beta.6"
