<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tickets · factory-orchestrator</title>
    <script>
      try {
        var t = localStorage.getItem("fo-theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#page">본문으로 건너뛰기</a>
    <div class="app" id="app">
      <main class="main" id="page">
        <header class="page-header">
          <h1 class="page-title">Tickets</h1>
          <span class="page-subtitle">Linear 기준 · 14:20에 맞췄어요</span>
          <div class="page-actions">
            <button class="btn" type="button" id="sync"></button>
          </div>
        </header>
        <div class="page-body">
          <div class="toolbar">
            <label class="search">
              <span class="visually-hidden">티켓 검색</span>
              <span id="search-icon"></span>
              <input class="input" id="q" type="search" placeholder="ID나 제목으로 찾기" autocomplete="off" spellcheck="false" />
            </label>
            <div class="segmented" role="group" aria-label="프로젝트" id="project-filter"></div>
            <div class="segmented" role="group" aria-label="할당 방식" id="mode-filter"></div>
            <span class="spacer"></span>
            <label class="secondary" style="display: inline-flex; align-items: center; gap: 6px">
              <input type="checkbox" id="show-done" /> Done 티켓도 보기
            </label>
          </div>

          <section class="card" aria-labelledby="tickets-title">
            <div class="card-header">
              <h2 class="card-title" id="tickets-title">티켓</h2>
              <span class="muted num" id="count"></span>
              <div class="page-actions legend">
                <span class="legend-item"><span class="tag" data-auto>factory</span> 자동 할당 라벨이 붙은 티켓은 운영자 없이 할당해요</span>
              </div>
            </div>
            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr>
                    <th class="col-shrink">ID</th>
                    <th>제목</th>
                    <th class="col-shrink">프로젝트</th>
                    <th class="col-shrink">Linear 상태</th>
                    <th class="col-shrink">라벨 · 할당</th>
                    <th class="col-shrink">최근 런</th>
                    <th class="col-shrink">러너</th>
                    <th class="col-shrink"><span class="visually-hidden">동작</span></th>
                  </tr>
                </thead>
                <tbody id="rows"></tbody>
              </table>
            </div>
            <div class="empty" id="empty" hidden>
              <strong>조건에 맞는 티켓이 없어요</strong>
              <span>검색어를 지우거나 다른 프로젝트를 골라 보세요.</span>
            </div>
          </section>
        </div>
      </main>
    </div>
    <script src="data.js"></script>
    <script src="app.js"></script>
    <script>
      (function () {
        const { icon, esc, runBadge } = FO;
        FO.mountShell("tickets");
        document.getElementById("search-icon").outerHTML = icon.search;
        document.getElementById("sync").innerHTML = `${icon.refresh}<span>Linear에서 다시 불러오기</span>`;
        document.getElementById("sync").addEventListener("click", () => FO.toast("Linear에서 티켓 19개를 다시 불러왔어요."));

        const state = { q: "", project: "전체", mode: "전체", showDone: false };
        const assignedNow = new Set();

        const projects = ["전체", ...FO.trackerProjects.map((p) => p.name)];
        const modes = ["전체", "자동", "직접", "할당 전"];

        function segmented(el, values, key) {
          el.innerHTML = values.map((v) => `<button type="button" aria-pressed="${state[key] === v}">${v}</button>`).join("");
          el.querySelectorAll("button").forEach((b, i) =>
            b.addEventListener("click", () => {
              state[key] = values[i];
              segmented(el, values, key);
              render();
            })
          );
        }

        function modeOf(t) {
          const runs = FO.runsFor(t.id);
          if (!runs.length && !assignedNow.has(t.id)) return "할당 전";
          return t.labels.includes(FO.AUTO_LABEL) ? "자동" : "직접";
        }

        function row(t) {
          const runs = FO.runsFor(t.id);
          const latest = runs[0];
          const mapping = FO.mappingFor(t.project);
          const auto = t.labels.includes(FO.AUTO_LABEL);
          const labels = t.labels
            .map((l) => `<span class="tag"${l === FO.AUTO_LABEL ? " data-auto" : ""}>${esc(l)}</span>`)
            .join(" ");

          let runCell = '<span class="muted">—</span>';
          let action = "";
          if (assignedNow.has(t.id)) {
            runCell = '<span class="badge" data-tone="queued">Queued</span>';
            action = '<span class="muted">맡겼어요</span>';
          } else if (latest) {
            const more = runs.length > 1 ? ` <span class="muted num">외 ${runs.length - 1}</span>` : "";
            runCell = `<a href="run.html?id=${latest.id}" style="display:inline-flex;align-items:center;gap:6px">${runBadge(latest)} <span class="mono muted">#${latest.id}</span></a>${more}`;
            if (latest.state === "done" && latest.result === "failed") {
              action = `<button class="btn btn-sm" type="button" data-assign="${t.id}">다시 할당하기</button>`;
            } else if (latest.state === "done" && latest.result === "check") {
              action = `<a class="btn btn-sm" href="https://github.com" target="_blank" rel="noreferrer">PR 확인하기</a>`;
            }
          } else if (t.trackerState !== "Done") {
            action = `<button class="btn btn-sm" type="button" data-assign="${t.id}">할당하기</button>`;
          }

          const who = latest ? latest.runner : mapping.runner;
          const agent = FO.agents[latest ? latest.agent : mapping.agent].name;
          const runner = FO.runner(who);

          return `<tr>
            <td class="ticket-id">${t.id}</td>
            <td><span class="cell-title" style="max-width:280px" title="${esc(t.title)}">${esc(t.title)}</span></td>
            <td class="secondary" style="white-space:nowrap">${esc(t.project)}</td>
            <td><span class="tag">${t.trackerState}</span></td>
            <td style="white-space:nowrap">${labels}${auto ? "" : ` <span class="muted">· ${runs.length || assignedNow.has(t.id) ? "직접" : "할당 전"}</span>`}</td>
            <td style="white-space:nowrap">${runCell}</td>
            <td style="white-space:nowrap" title="${agent}"><span style="display:inline-flex;align-items:center;gap:6px"><span class="dot" data-tone="${runner.online ? "online" : "offline"}"></span>${who}</span></td>
            <td style="text-align:end">${action}</td>
          </tr>`;
        }

        function render() {
          const q = state.q.trim().toLowerCase();
          const list = FO.tickets.filter((t) => {
            if (!state.showDone && t.trackerState === "Done") return false;
            if (state.project !== "전체" && t.project !== state.project) return false;
            if (state.mode !== "전체" && modeOf(t) !== state.mode) return false;
            if (q && !(t.id.toLowerCase().includes(q) || t.title.toLowerCase().includes(q))) return false;
            return true;
          });
          document.getElementById("rows").innerHTML = list.map(row).join("");
          document.getElementById("count").textContent = `${list.length}개`;
          document.getElementById("empty").hidden = list.length > 0;
          document.querySelectorAll("[data-assign]").forEach((b) =>
            b.addEventListener("click", () => {
              const t = FO.ticket(b.dataset.assign);
              const m = FO.mappingFor(t.project);
              assignedNow.add(t.id);
              render();
              FO.toast(`${t.id} 티켓을 ${m.runner}에 맡겼어요.`);
            })
          );
        }

        segmented(document.getElementById("project-filter"), projects, "project");
        segmented(document.getElementById("mode-filter"), modes, "mode");
        let debounce;
        document.getElementById("q").addEventListener("input", (e) => {
          clearTimeout(debounce);
          debounce = setTimeout(() => {
            state.q = e.target.value;
            render();
          }, 150);
        });
        document.getElementById("show-done").addEventListener("change", (e) => {
          state.showDone = e.target.checked;
          render();
        });
        render();
      })();
    </script>
  </body>
</html>
